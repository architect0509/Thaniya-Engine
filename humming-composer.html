<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><title>Thaniya-SoundLab</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>
// 예전 주소(humming-composer.html) 호환: 편집은 edit.html, 마이페이지는 mypage.html 로 넘김 (?engine 같은 값은 그대로 전달)
(function () {
  var q = location.search, h = location.hash;
  var my = h === '#mypage' || /[?&]mypage(=|&|$)/.test(q);
  location.replace((my ? './mypage.html' : './edit.html') + (my ? '' : q) + (my ? '' : h));
})();
</script></head><body><a href="./edit.html">편집 화면으로 이동</a></body></html>
