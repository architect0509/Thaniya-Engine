<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Thaniya 학습 · 콘솔 출력</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#14161b;--panel:#1b1e25;--raised:#242831;--code:#0f1115;--line:#343945;
  --tx:#e9eaee;--mut:#9aa0ab;--y:#f6cd2a;--y-fg:#1a1400;
  --ok:#5cc08a;--warn:#e8a33d;--err:#ea6773;--error:#ea6773;--info:#8e929b;--scr:#b69cff;
  --f:"Pretendard Variable","Pretendard","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --m:"D2Coding","JetBrains Mono","Cascadia Mono","Consolas","Menlo",monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:15px/1.65 var(--f);-webkit-text-size-adjust:100%}
code{font-family:var(--m);font-size:.92em;background:var(--raised);border:1px solid var(--line);border-radius:4px;padding:1px 5px;color:#f3e6a6}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,textarea:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--y);outline-offset:-1px}
.ic{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round;flex:none;display:block}
.ic.fl{fill:currentColor;stroke:none}
.spacer{flex:1}

/* ===== 상단 (컴팩트) ===== */
.top{display:flex;align-items:center;gap:12px;height:44px;padding:0 16px;border-bottom:1px solid var(--line);background:rgba(27,30,37,.82);-webkit-backdrop-filter:blur(14px) saturate(1.4);backdrop-filter:blur(14px) saturate(1.4);font-size:13px}
.brand{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:700;letter-spacing:-.01em}
.mark{width:13px;height:13px;border-radius:4px;background:linear-gradient(135deg,#ffdc55,#e9bd0c);box-shadow:inset -3px -3px 0 rgba(0,0,0,.16)}
.lesson{display:flex;align-items:center;gap:8px;color:var(--mut);font-size:13px;padding-left:12px;border-left:1px solid var(--line);height:18px}
.lesson b{display:inline-flex;align-items:center;height:20px;padding:0 8px;border-radius:999px;background:rgba(246,205,42,.14);box-shadow:inset 0 0 0 1px rgba(246,205,42,.28);color:#ffdc55;font-size:11px;font-weight:600;margin:0}
.prog{margin-left:auto;display:flex;align-items:center;gap:8px;color:var(--mut);font-size:12px;font-variant-numeric:tabular-nums}
.prog .bar{width:72px;height:4px;border-radius:99px;background:rgba(255,255,255,.1);overflow:hidden}
.prog .bar i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,#f6cd2a,#ffdf6b);transition:width .3s}
.lead{margin:0;padding:7px 16px;color:var(--mut);font-size:12.5px;line-height:1.5;border-bottom:1px solid var(--line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.steps{display:flex;gap:6px;padding:10px 16px 0;overflow-x:auto;scrollbar-width:none}
.steps::-webkit-scrollbar{display:none}
.step{flex:none;display:flex;align-items:center;gap:6px;height:28px;padding:0 12px 0 5px;border:1px solid var(--line);background:rgba(255,255,255,.03);border-radius:999px;color:var(--mut);font-size:12.5px;transition:background .15s,border-color .15s,color .15s}
.step .n{display:grid;place-items:center;width:18px;height:18px;border-radius:50%;background:var(--raised);font-size:10.5px;font-weight:600;color:var(--tx)}
.step:hover{border-color:#4a5060;color:var(--tx);background:rgba(255,255,255,.06)}
.step.cur{background:linear-gradient(180deg,#f6cd2a,#e9bd0c);border-color:transparent;color:var(--y-fg);font-weight:600;box-shadow:0 3px 12px rgba(233,189,12,.28)}
.step.cur .n{background:rgba(0,0,0,.16);color:var(--y-fg)}
.step.done:not(.cur) .n{background:var(--ok);color:#06210f}
.step.done .n::after{content:"✓";font-size:10px}
.step.done .n span{display:none}

.tg{flex:none;display:grid;place-items:center;width:26px;height:26px;padding:0;border:1px solid var(--line);border-radius:50%;background:rgba(255,255,255,.03);color:var(--mut);transition:background .15s,color .15s,border-color .15s}
.tg:hover{background:rgba(255,255,255,.08);color:var(--tx);border-color:#4a5060}
.tg::before{content:"";width:6px;height:6px;border-right:1.6px solid currentColor;border-bottom:1.6px solid currentColor;transform:translateY(-1px) rotate(225deg);transition:transform .2s}
.tg[aria-expanded="false"]::before{transform:translateY(-2px) rotate(45deg)}
.topx{display:grid;grid-template-rows:1fr;transition:grid-template-rows .22s ease}
.topx-in{min-height:0;overflow:hidden}
.topx.closed{grid-template-rows:0fr}
.topx.closed .topx-in{visibility:hidden;transition:visibility 0s .22s}
@media (prefers-reduced-motion:reduce){.topx,.tg::before{transition:none}}

/* ===== 패널: Thaniya Engine(index)과 같은 디자인 ===== */
.ws{
  --fg:#f2f2f5;--mute:#9b9ba6;--line:rgba(255,255,255,.07);--line2:rgba(255,255,255,.12);
  --pbg:rgba(38,38,44,.58);--head:rgba(255,255,255,.04);--field:rgba(0,0,0,.34);
  --hover:rgba(255,255,255,.08);--btn:rgba(255,255,255,.09);--btn-h:rgba(255,255,255,.16);
  --sel:#e9bd0c;--sel-fg:#1a1400;--accent:#e9bd0c;--danger:#ff6b78;--good:#4cd98a;--warnc:#ffd24a;--canvas:#141417;
  --fb:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --fm:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  display:grid;gap:12px;padding:16px 20px 24px;align-items:stretch;
  grid-template-columns:300px minmax(0,1fr) 320px;
  grid-template-areas:"brief view hier" "brief code insp" "brief con insp"
}
.pn{display:flex;flex-direction:column;min-width:0;overflow:hidden;color:var(--fg);font:12px/1.4 var(--fb);
  background:var(--pbg);-webkit-backdrop-filter:blur(22px) saturate(1.4);backdrop-filter:blur(22px) saturate(1.4);
  border:1px solid var(--line);border-radius:18px;box-shadow:inset 0 1px 0 rgba(255,255,255,.06)}
.pn.collapsed{min-height:0!important;align-self:start}
.pn.collapsed>:not(.phead){display:none!important}
.phead{display:flex;align-items:center;gap:4px;height:34px;padding:0 8px;flex:none;background:var(--head);border-bottom:1px solid var(--line);user-select:none;-webkit-user-select:none}
.ptab{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 11px;border-radius:999px;background:rgba(233,189,12,.18);color:var(--accent);font-weight:500;white-space:nowrap}
.pcol{background:none;border:0;color:var(--mute);width:20px;height:22px;padding:0;border-radius:3px;flex:none;display:inline-flex;align-items:center;justify-content:center}
.pcol:hover{background:var(--hover);color:var(--fg)}
.pcol::before{content:"▾";font-size:11px}
.pn.collapsed .pcol::before{content:"▸"}
.ptool{position:sticky;top:0;z-index:3;display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:5px 6px;background:var(--pbg);border-bottom:1px solid var(--line);flex:none}
.ws input[type=text],.ws input[type=number],.ws input[type=search]{background:var(--field);border:1px solid var(--line2);border-radius:10px;height:22px;padding:0 6px;min-width:0;width:100%;color:var(--fg)}
.ws input[type=text]:focus,.ws input[type=number]:focus,.ws input[type=search]:focus{outline:none;border-color:var(--accent)}
.ws input[type=checkbox]{accent-color:#e9bd0c}
.search{flex:1;min-width:0}
.btn{background:var(--btn);border:1px solid var(--line2);border-radius:10px;height:24px;padding:0 10px;white-space:nowrap;color:var(--fg)}
.btn:hover:not(:disabled){background:var(--btn-h)}
.btn.sm{height:22px;padding:0 8px}
.btn.pri{background:linear-gradient(180deg,#f6cd2a,#e9bd0c);color:#1a1400;border:0;border-radius:999px;box-shadow:0 4px 16px rgba(233,189,12,.35);font-weight:600}
.btn.pri:hover{filter:brightness(1.08)}
.btn kbd{font:10px var(--fm);opacity:.6;margin-left:4px}
.ib{background:none;border:0;border-radius:10px;width:22px;height:22px;padding:0;display:inline-flex;align-items:center;justify-content:center;color:var(--mute);flex:none}
.ib:hover{background:var(--hover);color:var(--fg)}

/* 문제 (학습 전용 패널, 외형만 맞춤) */
.brief-pn{grid-area:brief;display:block;padding:20px 20px 18px;align-self:start;font-size:14px;line-height:1.65}
.brief-pn h1{margin:0 0 10px;font-size:19px;line-height:1.35;letter-spacing:-.02em}
.brief-pn p{margin:0 0 14px;color:#d6d6de}
.goal{border-left:3px solid var(--accent);background:rgba(255,255,255,.04);border-radius:0 12px 12px 0;padding:10px 14px;margin:0 0 16px}
.goal b{color:var(--accent)}
.lbl{font-size:12px;color:var(--mute);margin:0 0 6px;font-weight:600}
.hint{margin:10px 0 0;padding:12px 14px;background:#101013;border:1px solid var(--line2);border-radius:12px;font:12.5px/1.6 var(--fm);white-space:pre-wrap;color:#e6e6ea}

/* 씬 뷰 · 게임 뷰 */
.view-pn{grid-area:view}
.vtabs{display:inline-flex;gap:2px;padding:2px;border-radius:999px;background:rgba(0,0,0,.28);border:1px solid var(--line)}
.vtab{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 12px;border:0;border-radius:999px;background:none;color:var(--mute);font-weight:500}
.vtab:hover{color:var(--fg)}
.vtab.on{background:rgba(233,189,12,.18);color:var(--accent)}
.vtab .ic{width:13px;height:13px}
.vtitle{display:none}
.badge{height:22px;padding:0 10px;border-radius:999px;font-size:11px;font-weight:600;display:none;align-items:center}
.badge.on{display:inline-flex;background:rgba(76,217,138,.18);color:var(--good)}
.badge.on.bad{background:rgba(255,107,120,.18);color:var(--danger)}
.vwrap{display:flex;height:250px;background:var(--canvas)}
.vp{flex:1;min-width:0;position:relative}
.vp canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.vp .vl{position:absolute;left:8px;top:6px;font-size:11px;color:var(--mute);pointer-events:none;text-shadow:0 1px 2px #000}
.vp#pGame{border-left:1px solid var(--line);background:#0d0d10}
.views.tabs-mode .vp:not(.on){display:none}
.views.tabs-mode .vp#pGame{border-left:0}
@media (min-width:1500px){.view-pn .vtabs{display:none}.view-pn .vtitle{display:inline-flex;gap:4px}.views .vp{display:block!important}}

/* 스크립트 편집기 */
.code-pn{grid-area:code;display:flex;flex-direction:column;gap:10px;min-width:0}
.sedbar{display:flex;align-items:center;gap:8px;padding:8px 10px 0;background:rgba(255,255,255,.03);border-bottom:1px solid var(--line);flex:none}
.sedbar .btn{margin-bottom:8px}
.sedtabs{display:flex;gap:4px;min-width:0;overflow-x:auto;scrollbar-width:none}
.sedtab{display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 12px;border-radius:12px 12px 0 0;background:#101013;color:var(--fg);box-shadow:inset 0 2px 0 var(--accent);white-space:nowrap}
.sedtab .ic{color:var(--accent)}
.edwrap{display:flex;height:300px;background:#101013;font:13px/1.65 var(--fm)}
.gut{margin:0;padding:12px 10px 12px 14px;text-align:right;color:rgba(255,255,255,.28);user-select:none;overflow:hidden;min-width:46px;border-right:1px solid var(--line);font:inherit;white-space:pre}
.edcode{position:relative;flex:1;min-width:0}
.edcode pre,.edcode textarea{position:absolute;inset:0;margin:0;padding:12px 16px;font:inherit;white-space:pre;tab-size:4;border:0;outline:0;overflow:auto;letter-spacing:0;word-spacing:0}
.edcode pre{pointer-events:none;overflow:hidden;color:#e6e6ea}
.edcode textarea{background:transparent;color:transparent;caret-color:var(--accent);resize:none;border-radius:0}
.edcode textarea::selection{background:rgba(233,189,12,.28)}
.edcode textarea:focus-visible{outline:none}
.t-cm{color:#6f7a6a;font-style:italic}.t-st{color:#a5d6a7}.t-kw{color:#e9bd0c}.t-ty{color:#7fb9ff}.t-nu{color:#ff9e7a}.t-fn{color:#d6b8ff}
.sedfoot{display:flex;gap:16px;align-items:center;padding:6px 14px;font-size:11.5px;color:var(--mute);border-top:1px solid var(--line);background:rgba(255,255,255,.03);flex:none;white-space:nowrap;overflow:hidden}
#edStat{overflow:hidden;text-overflow:ellipsis;min-width:0}
#edStat.ok{color:var(--good)}#edStat.bad{color:var(--danger)}
.verdict{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 14px;border-radius:14px;border:1px solid var(--line2);background:var(--pbg);color:var(--mute);font:13px/1.5 var(--fb)}
.verdict.ok{border-color:rgba(76,217,138,.45);background:rgba(76,217,138,.1);color:#c6f5da}
.verdict.bad{border-color:rgba(255,107,120,.45);background:rgba(255,107,120,.1);color:#ffc9ce}
.verdict .nx{margin-left:auto;height:28px;padding:0 16px}

/* 콘솔 */
.con-pn{grid-area:con}
.cf{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:999px;border:1px solid var(--line2);background:var(--btn);color:var(--fg)}
.cf.off{opacity:.45}
.cf .d{width:8px;height:8px;border-radius:50%;background:var(--mute)}
.cf .d.info{background:#8ab4ff}.cf .d.warn{background:var(--warnc)}.cf .d.error{background:var(--danger)}
.conlist{font:11.5px/1.5 var(--fm);overflow:auto;min-height:96px;max-height:240px}
.cl{display:flex;gap:10px;padding:3px 12px;border-bottom:1px solid var(--line);white-space:pre-wrap;word-break:break-word;align-items:baseline}
.cl .ct{color:var(--mute);flex:none}
.cl .cm{flex:1;min-width:0}
.cl.warn{background:rgba(255,210,74,.08);color:var(--warnc)}
.cl.error{background:rgba(255,107,120,.1);color:var(--danger)}
.empty{padding:10px 12px;color:var(--mute);font:11.5px/1.5 var(--fb)}
.conlist.play .cl{animation:pop .22s ease-out both;animation-delay:calc(var(--i)*70ms)}
@keyframes pop{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.exp .conlist{max-height:none;min-height:0;border:1px solid var(--line2);border-radius:12px;background:#101013;margin-bottom:16px}

/* 계층 구조 */
.hier-pn{grid-area:hier;position:relative;min-height:150px}
.hwrap{position:absolute;inset:34px 0 0 0;display:flex;flex-direction:column}
.tree{flex:1;min-height:0;overflow:auto;padding:2px 0 8px}
.tr{display:flex;align-items:center;gap:4px;height:28px;margin:1px 6px;padding:0 6px 0 calc(var(--d)*14px + 4px);border-radius:10px;white-space:nowrap;cursor:default}
.tr:hover{background:var(--hover)}
.tr.on{background:var(--sel);color:var(--sel-fg);box-shadow:0 2px 10px rgba(233,189,12,.3)}
.tr.on .ts,.tr.on .ti,.tr.on .fold{color:inherit!important}
.fold{width:14px;height:14px;padding:0;background:none;border:0;color:var(--mute);flex:none;display:inline-flex;align-items:center;justify-content:center}
.fold::before{content:"▸";font-size:10px;transition:transform .1s}
.fold.open::before{transform:rotate(90deg)}
.fold.sp::before{content:""}
.ti{display:inline-flex;color:var(--mute);flex:none}
.tl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.tl b{font-weight:600}
.ts{color:var(--mute);font:10.5px var(--fm);flex:none}
.wbadge{font:600 9px var(--fm);padding:0 4px;border-radius:3px;background:var(--warnc);color:#1a1100;margin-left:4px;vertical-align:1px}

/* 인스펙터 */
.insp-pn{grid-area:insp}
.pbody{flex:1;min-height:0;overflow:auto}
.ihead{display:flex;align-items:center;gap:8px;padding:10px 10px 8px}
.ibadge{width:30px;height:30px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;color:#fff;flex:none}
.ibadge .ic{width:18px;height:18px}
.ws input.iname{font-size:13px;font-weight:600;height:26px;flex:1}
.tag{font-size:10.5px;color:var(--mute);border:1px solid var(--line2);border-radius:10px;padding:0 8px;white-space:nowrap;flex:none}
.comp{position:relative;border-radius:14px;overflow:hidden;margin:6px 8px;background:rgba(255,255,255,.04);border:1px solid var(--line)}
.chead{display:flex;align-items:center;gap:7px;width:100%;height:24px;padding:0 10px 0 8px;background:var(--head);border:0;color:var(--fg);font-weight:600;text-align:left}
.chead:hover{background:var(--btn)}
.chead .ic{color:var(--mute)}
.chead::before{content:"▾";font-size:10px;color:var(--mute);width:10px}
.comp.closed .chead::before{content:"▸"}
.comp.closed .cbody{display:none}
.chead>span{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chead small{color:var(--mute);font-weight:400}
.cbody{padding:6px 10px 8px}
.fr{display:grid;grid-template-columns:40% 1fr;gap:8px;align-items:center;margin:4px 0;min-width:0}
.fr>label{color:var(--mute);display:flex;flex-wrap:wrap;align-items:baseline;column-gap:6px;line-height:1.25;min-width:0}
.lt{display:inline-flex;align-items:center;gap:4px;max-width:100%;min-width:0}
.en{display:inline-block;font-size:10px;color:var(--mute);opacity:.7;font-family:var(--fm);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.q{box-sizing:border-box;flex:none;display:inline-block;width:13px;height:13px;border-radius:50%;border:1px solid var(--line2);color:var(--mute);font:600 9px/11px var(--fb);text-align:center;cursor:help}
.q:hover{background:var(--accent);border-color:var(--accent);color:var(--sel-fg)}
.fv{min-width:0;display:flex;gap:4px;align-items:center}
.fv>input[type=checkbox]{margin:0 2px 0 auto;width:15px;height:15px}
.num{display:flex;align-items:center;flex:1;min-width:0;background:var(--field);border:1px solid var(--line2);border-radius:10px;height:22px;overflow:hidden}
.num:focus-within{border-color:var(--accent)}
.num i{font-style:normal;font-size:10px;color:var(--mute);padding:0 5px;border-right:1px solid var(--line2);height:100%;display:flex;align-items:center;cursor:ew-resize;user-select:none;touch-action:none}
.ws .num input{border:0;background:none;height:20px;border-radius:0;-moz-appearance:textfield;appearance:textfield}
.ws .num input::-webkit-inner-spin-button,.ws .num input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.ws input[readonly]{color:var(--mute)}
body.scrub,body.scrub *{cursor:ew-resize!important;user-select:none!important}
.note{grid-column:1/-1;margin:4px 0 0;font-size:11.5px;color:var(--mute);line-height:1.5}
.note code{font:11px var(--fm);background:rgba(255,255,255,.07);border:0;color:var(--fg);padding:0 4px}

@media (max-width:1180px){
  .ws{grid-template-columns:280px minmax(0,1fr);grid-template-areas:"brief view" "brief code" "brief con" "hier insp"}
  .hwrap{position:static}.tree{max-height:260px}.hier-pn{min-height:0}
}
@media (max-width:860px){
  .ws{grid-template-columns:minmax(0,1fr);grid-template-areas:"brief" "code" "con" "view" "hier" "insp";padding:14px}
  .top{gap:8px;padding:0 12px}
  .lesson{display:none}
  .lead,.steps{padding-left:12px;padding-right:12px}
  .step{padding:0 6px 0 5px}.step .t{display:none}.step.cur .t{display:inline}
  .btn kbd{display:none}.vwrap{height:230px}
}
@media (prefers-reduced-motion:reduce){.conlist.play .cl{animation:none}.prog .bar i{transition:none}}

/* ===== 메인 화면 (레슨 카드) · iOS 유리 느낌 ===== */
[hidden]{display:none!important}
.back{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 11px 0 9px;border:1px solid var(--line);border-radius:999px;background:rgba(255,255,255,.03);color:var(--mut);font-size:12px}
.back:hover{color:var(--tx);border-color:#4a5060}
.home{position:relative;isolation:isolate;min-height:100vh;background:#0e1014}
.home::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:
  radial-gradient(440px 440px at 10% 6%,rgba(246,205,42,.42),transparent 70%),
  radial-gradient(540px 540px at 90% 28%,rgba(124,92,255,.40),transparent 70%),
  radial-gradient(500px 500px at 28% 96%,rgba(48,200,170,.30),transparent 70%),
  radial-gradient(440px 440px at 96% 100%,rgba(255,110,140,.26),transparent 70%)}

<script>
/* ===== 학습 사이트용 실행기: 엔진의 C# 해석기를 그대로 사용하고, Debug.Log 출력만 가로챕니다 ===== */
let OUT=[];
function clog(type,msg){if(OUT.length<300)OUT.push([type,String(msg)])}
let play=null;
const KIND={info:'일반 로그',warn:'경고',error:'오류'};

function runOnce(code,over,sc){
  OUT=[];
  const res=parseCS(code);
  if(res.errs.length){
    res.errs.forEach(e=>OUT.push(['error','Quiz.cs('+e.line+'): '+e.msg]));
    return{out:OUT.slice(),fatal:true};
  }
  if(!res.methods.Start&&!res.methods.Awake){
    OUT.push(['error','Start() 메서드가 없어요. void Start() { } 안에 코드를 쓰세요.']);
    return{out:OUT.slice(),fatal:true};
  }
  const rt={f:{},ty:{}};
  res.fields.forEach(f=>{rt.f[f.name]=csDefault(f.type,f.def);rt.ty[f.name]=f.type});
  Object.assign(rt.f,over||{});
  const cx={m:{objs:sc||[],ui:[],uiGroups:[]},o:(sc&&sc.find(q=>q.id==='quiz'))||{name:'Quiz',props:{}},rt,s:{id:1,name:res.cls||'Quiz'},pr:{r:res,ast:{}},scopes:[],me:null,loops:0,depth:0,dt:.016};
  let fatal=false;
  csCur=cx;
  try{
    for(const n of['Awake','Start'])if(res.methods[n])csCallUser(cx,n,[]);
  }catch(e){
    fatal=true;
    let msg=e&&e.message?e.message:'알 수 없는 오류';
    if(e instanceof CsUnsup)msg=/^[A-Za-z_]\w*$/.test(msg)?'\''+msg+'\'을(를) 찾을 수 없어요. 변수 이름을 잘못 썼거나 선언하지 않았는지 확인하세요.':'이 학습 사이트에서는 아직 지원하지 않는 기능이에요: '+msg;
    if(e&&e.line!=null)msg='('+e.line+'번째 줄) '+msg;
    OUT.push(['error',msg]);
  }finally{csCur=null}
  return{out:OUT.slice(),fatal};
}

function diffOut(exp,got){
  if(exp.length!==got.length)return'출력이 '+got.length+'줄이에요. '+exp.length+'줄이어야 해요.';
  for(let i=0;i<exp.length;i++){
    if(exp[i][1]!==got[i][1])return(i+1)+'번째 줄이 달라요. 기대: “'+exp[i][1]+'” / 내 출력: “'+got[i][1]+'”';
    if(exp[i][0]!==got[i][0])return(i+1)+'번째 줄의 종류가 달라요. 기대: '+KIND[exp[i][0]]+' / 내 출력: '+KIND[got[i][0]];
  }
  return'';
}
const fieldDesc=f=>Object.keys(f).map(k=>k+' = '+f[k]).join(', ');

function snTestScene(over){
  const a=SN_INIT.map(o=>({...o}));
  if(over)Object.keys(over).forEach(id=>{const o=a.find(q=>q.id===id);if(o)Object.assign(o,over[id])});
  return a;
}
function gradeProblem(p,code){
  const runs=p.tests.map(t=>{const sc=p.scene?snTestScene(t.sc):null;return{t,sc,r:runOnce(code,t.f,sc)}});
  const first=runs[0].r;
  for(let i=0;i<runs.length;i++){
    const{t,sc,r}=runs[i];
    const pre=i?(t.why||'값을 바꿔 시험했더니('+fieldDesc(t.f)+') ')+'결과가 달라요. ':'';
    if(r.fatal)return{first,pass:false,msg:'코드를 끝까지 실행하지 못했어요. 콘솔의 오류를 읽고 고쳐 보세요.'};
    const d=diffOut(t.out,r.out);
    if(d)return{first,pass:false,msg:pre+d};
    const v=p.verify&&p.verify(sc,t.f||{},t);
    if(v)return{first,pass:false,msg:pre+v};
  }
  if(p.must&&!p.must[0].test(csBlank(code,true)))return{first,pass:false,msg:p.must[1]};
  return{first,pass:true};
}

/* ===== 레슨 1: 콘솔 출력 ===== */
const L1={no:1,clear:'통과했어요. 레슨 1 완료! 콘솔로 값을 확인하는 법을 익혔어요.',title:'콘솔 출력',lead:'콘솔은 프로그램이 개발자에게 말을 거는 창입니다. Debug.Log로 값을 찍어 보면서 코드가 제대로 움직이는지 확인해요.'};

{id:'level',title:'경고와 오류 구분하기',

 tests:[{f:{},out:[['warn','배터리가 얼마 남지 않았어요'],['error','저장에 실패했어요']]}],
 hint:'Debug.LogWarning("배터리가 얼마 남지 않았어요");\nDebug.LogError("저장에 실패했어요");'},
{id:'sum',title:'계산 결과 출력하기',

/* ===== 미니 씬: 씬 뷰 · 게임 뷰 · 하이어라키 · 인스펙터가 함께 쓰는 데이터와 그리기 ===== */
const SN_COLS=14,SN_ROWS=9;
const SN_WALL=new Set();
for(let x=0;x<SN_COLS;x++){SN_WALL.add(x+',0');SN_WALL.add(x+','+(SN_ROWS-1))}
for(let y=0;y<SN_ROWS;y++){SN_WALL.add('0,'+y);SN_WALL.add((SN_COLS-1)+','+y)}
[[5,2],[5,3],[9,5],[9,6]].forEach(p=>SN_WALL.add(p[0]+','+p[1]));
const SN_KINDS={
  camera:{c:'#8fb8ff',en:'Camera'},hero:{c:'#f6cd2a',en:'Hero'},monster:{c:'#5cc08a',en:'Monster'},
  light:{c:'#ff9f43',en:'Light'},script:{c:'#b69cff',en:'GameObject'}
};
const SN_OBJS=[
  {id:'cam',name:'메인 카메라',kind:'camera',size:3,follow:true},
  {id:'hero',name:'주인공',kind:'hero',x:3,y:4,hp:100,speed:120},
  {id:'slime',name:'슬라임',kind:'monster',x:8,y:4,hp:5,speed:80,range:6},
  {id:'torch',name:'횃불',kind:'light',x:7,y:2,intensity:.7,radius:6,shadows:true},
  {id:'quiz',name:'퀴즈',kind:'script',x:6,y:6}
];
const SN={sel:'quiz',geo:{},onSel:null,onMove:null};
/* 채점은 늘 처음 상태의 씬 복사본에서, 실행은 지금 씬에서 합니다 (Unity 플레이 모드처럼 실행이 끝나면 되돌려요) */
const SN_INIT=SN_OBJS.map(o=>({...o}));
let SN_EDIT=null;
const snClone=a=>a.map(o=>({...o}));
function snRestore(){
  if(!SN_EDIT)return;
  SN_EDIT.forEach(s=>{const o=SN_OBJS.find(q=>q.id===s.id);if(o){Object.keys(o).forEach(k=>delete o[k]);Object.assign(o,s)}});
  SN_EDIT=null;
}
const SN_FONT='12px ui-sans-serif,system-ui,"Apple SD Gothic Neo","Malgun Gothic",sans-serif';

/* 카메라가 보여 주는 칸 범위 (카메라 크기 = 세로 칸 수의 절반, 화면비 10:6) */
function snView(){
  const cam=SN_OBJS[0],hero=SN_OBJS.find(o=>o.kind==='hero');
  const h=Math.min(SN_ROWS,Math.max(2,Math.round(cam.size*2))),w=Math.min(SN_COLS,Math.round(h*10/6));
  const cx=cam.follow?hero.x+.5:SN_COLS/2,cy=cam.follow?hero.y+.5:SN_ROWS/2;
  return{x:clamp(Math.round(cx-w/2),0,SN_COLS-w),y:clamp(Math.round(cy-h/2),0,SN_ROWS-h),w,h};
}

function snCanvas(cv){
  const r=cv.parentElement.getBoundingClientRect(),d=window.devicePixelRatio||1;
  const w=Math.round(r.width),h=Math.round(r.height);
  if(w<4||h<4)return null;
  if(cv.width!==Math.round(w*d)||cv.height!==Math.round(h*d)){cv.width=Math.round(w*d);cv.height=Math.round(h*d)}
  const c=cv.getContext('2d');c.setTransform(d,0,0,d,0,0);
  return{c,w,h,d};
}

function snTiles(c,ox,oy,ts,x0,y0,x1,y1,grid){
  for(let y=y0;y<y1;y++)for(let x=x0;x<x1;x++){
    const px=ox+(x-x0)*ts,py=oy+(y-y0)*ts;
    if(SN_WALL.has(x+','+y)){
      c.fillStyle='#454b5c';c.fillRect(px,py,ts,ts);
      c.fillStyle='#5a627a';c.fillRect(px,py,ts,Math.max(2,ts*.22));
      c.fillStyle='rgba(0,0,0,.18)';c.fillRect(px,py+ts-Math.max(2,ts*.1),ts,Math.max(2,ts*.1));
    }else{
      c.fillStyle=(x+y)%2?'#222733':'#262b38';c.fillRect(px,py,ts,ts);
    }
    if(grid){c.strokeStyle='rgba(255,255,255,.05)';c.lineWidth=1;c.strokeRect(px+.5,py+.5,ts,ts)}
  }
}

function snSprite(c,o,cx,cy,ts,scene){
  const r=ts*.34;c.save();c.translate(cx,cy);
  c.lineWidth=Math.max(1,ts/18);
  if(o.kind==='hero'){
    c.fillStyle='#f6cd2a';c.strokeStyle='#8a6d00';c.beginPath();c.arc(0,0,r,0,Math.PI*2);c.fill();c.stroke();
    c.fillStyle='#1a1400';c.fillRect(-r*.5,-r*.25,r*.24,r*.5);c.fillRect(r*.26,-r*.25,r*.24,r*.5);
  }else if(o.kind==='monster'){
    c.fillStyle='#5cc08a';c.strokeStyle='#2c7a52';
    c.beginPath();c.moveTo(-r*1.05,r*.7);c.quadraticCurveTo(-r*1.05,-r*1.05,0,-r*1.05);c.quadraticCurveTo(r*1.05,-r*1.05,r*1.05,r*.7);c.closePath();c.fill();c.stroke();
    c.fillStyle='#fff';c.beginPath();c.arc(-r*.4,-r*.1,r*.2,0,7);c.arc(r*.4,-r*.1,r*.2,0,7);c.fill();
    c.fillStyle='#10321f';c.beginPath();c.arc(-r*.4,-r*.08,r*.09,0,7);c.arc(r*.4,-r*.08,r*.09,0,7);c.fill();
  }else if(o.kind==='light'){
    c.fillStyle='#6b4a2a';c.fillRect(-r*.14,-r*.05,r*.28,r*1.0);
    c.fillStyle='#ff9f43';c.beginPath();c.arc(0,-r*.4,r*.52,0,7);c.fill();
    c.fillStyle='#ffe08a';c.beginPath();c.arc(0,-r*.32,r*.26,0,7);c.fill();
  }else if(o.kind==='script'&&scene){
    c.strokeStyle='#b69cff';c.fillStyle='rgba(182,156,255,.18)';c.lineWidth=Math.max(1.5,ts/14);
    c.beginPath();c.moveTo(0,-r);c.lineTo(r,0);c.lineTo(0,r);c.lineTo(-r,0);c.closePath();c.fill();c.stroke();
    c.fillStyle='#d9ccff';c.font='bold '+Math.max(9,ts*.26)+'px ui-monospace,monospace';c.textAlign='center';c.textBaseline='middle';c.fillText('C#',0,1);
  }
  c.restore();
}

function snDrawScene(){
  const cv=document.getElementById('cScene'),k=snCanvas(cv);if(!k)return;
  const{c,w,h}=k;
  const ts=Math.max(8,Math.floor(Math.min(w/SN_COLS,h/SN_ROWS))),ox=Math.round((w-ts*SN_COLS)/2),oy=Math.round((h-ts*SN_ROWS)/2);
  SN.geo.scene={ts,ox,oy};
  c.fillStyle='#141417';c.fillRect(0,0,w,h);
  snTiles(c,ox,oy,ts,0,0,SN_COLS,SN_ROWS,true);
  /* 카메라가 보는 범위 */
  const v=snView(),camSel=SN.sel==='cam';
  c.save();c.setLineDash(camSel?[]:[5,4]);c.strokeStyle=camSel?'#f6cd2a':'rgba(143,184,255,.8)';c.lineWidth=camSel?2:1.5;
  c.strokeRect(ox+v.x*ts+.5,oy+v.y*ts+.5,v.w*ts,v.h*ts);c.restore();
  c.font=SN_FONT;c.textAlign='left';c.textBaseline='alphabetic';c.fillStyle=camSel?'#f6cd2a':'rgba(143,184,255,.95)';
  c.fillText('메인 카메라',ox+v.x*ts+6,oy+v.y*ts+15);
  /* 오브젝트 */
  SN_OBJS.filter(o=>o.kind!=='camera').forEach(o=>{
    const cx=ox+(o.x+.5)*ts,cy=oy+(o.y+.5)*ts;
    c.globalAlpha=o.active===false?.3:(o.kind==='light'&&o.enabled===false?.5:1);snSprite(c,o,cx,cy,ts,true);c.globalAlpha=1;
    c.font=SN_FONT;c.textAlign='center';c.textBaseline='alphabetic';
    c.fillStyle='rgba(0,0,0,.55)';const tw=c.measureText(o.name).width;c.fillRect(cx-tw/2-4,cy+ts*.36,tw+8,16);
    c.fillStyle='#e9eaee';c.fillText(o.name,cx,cy+ts*.36+12);
  });
  /* 선택 표시 */
  const s=SN_OBJS.find(o=>o.id===SN.sel);
  if(s&&s.kind!=='camera'){
    const px=ox+s.x*ts,py=oy+s.y*ts;
    c.strokeStyle='#f6cd2a';c.lineWidth=2;c.strokeRect(px+1,py+1,ts-2,ts-2);
    const cx=px+ts/2,cy=py+ts/2,L=ts*.62;
    c.lineWidth=2;c.strokeStyle='#ea6773';c.beginPath();c.moveTo(cx,cy);c.lineTo(cx+L,cy);c.stroke();
    c.fillStyle='#ea6773';c.beginPath();c.moveTo(cx+L+6,cy);c.lineTo(cx+L-1,cy-4);c.lineTo(cx+L-1,cy+4);c.fill();
    c.strokeStyle='#5cc08a';c.beginPath();c.moveTo(cx,cy);c.lineTo(cx,cy+L);c.stroke();
    c.fillStyle='#5cc08a';c.beginPath();c.moveTo(cx,cy+L+6);c.lineTo(cx-4,cy+L-1);c.lineTo(cx+4,cy+L-1);c.fill();
  }
}

let SN_OV=null;
function snDrawGame(){
  const cv=document.getElementById('cGame'),k=snCanvas(cv);if(!k)return;
  const{c,w,h,d}=k,v=snView();
  const ts=Math.min(w/v.w,h/v.h),ox=(w-ts*v.w)/2,oy=(h-ts*v.h)/2;
  c.fillStyle='#0d0d10';c.fillRect(0,0,w,h);
  c.save();c.beginPath();c.rect(ox,oy,ts*v.w,ts*v.h);c.clip();
  snTiles(c,ox,oy,ts,v.x,v.y,v.x+v.w,v.y+v.h,false);
  SN_OBJS.filter(o=>(o.kind==='hero'||o.kind==='monster'||o.kind==='light')&&o.active!==false).forEach(o=>{
    snSprite(c,o,ox+(o.x-v.x+.5)*ts,oy+(o.y-v.y+.5)*ts,ts,false);
  });
  /* 어둠: 주인공과 횃불 주변만 밝게 */
  const ov=SN_OV||(SN_OV=document.createElement('canvas'));
  if(ov.width!==cv.width||ov.height!==cv.height){ov.width=cv.width;ov.height=cv.height}
  const o2=ov.getContext('2d');o2.setTransform(d,0,0,d,0,0);o2.globalCompositeOperation='source-over';o2.clearRect(0,0,w,h);
  o2.fillStyle='rgba(5,8,18,.68)';o2.fillRect(0,0,w,h);o2.globalCompositeOperation='destination-out';
  const hole=(x,y,rad,a)=>{const px=ox+(x-v.x+.5)*ts,py=oy+(y-v.y+.5)*ts,R=rad*ts,g=o2.createRadialGradient(px,py,0,px,py,R);g.addColorStop(0,'rgba(0,0,0,'+a+')');g.addColorStop(1,'rgba(0,0,0,0)');o2.fillStyle=g;o2.fillRect(px-R,py-R,R*2,R*2)};

function snPick(px,py){

  SN_OBJS.forEach(o=>{if(o.kind==='camera')return;const dd=Math.hypot(o.x-fx,o.y-fy);if(dd<=bd){bd=dd;best=o}});

const snNum=v=>+(+v).toFixed(4);
function snMoveTo(o,x,y){o.x=clamp(snNum(x),1,SN_COLS-2);o.y=clamp(snNum(y),1,SN_ROWS-2)}
function csGetComp(m,o,T){
  switch(T){
    case'Transform':return trProxy(m,o);
    case'GameObject':return goProxy(m,o);
    case'Camera':return o.kind==='camera'?camProxy(m,o):null;
    case'Light':case'Light2D':return o.kind==='light'?lightProxy(m,o):null;
    case'Hero':return o.kind==='hero'?heroProxy(m,o):null;
  }
  throw csUnsup('GetComponent<'+T+'>()');
}
function trProxy(m,o){
  if(o.kind==='camera')throw csUnsup('카메라의 Transform');
  return{__h:'Transform',__o:o,name:o.name,
    get(n){
      if(n==='position'||n==='localPosition')return CsV(o.x,o.y);
      if(n==='gameObject')return goProxy(m,o);
      if(n==='name')return o.name;
      throw csUnsup('transform.'+n)},
    set(n,v){
      if(n==='position'||n==='localPosition'){const q=csVArg([v]);snMoveTo(o,q.x,q.y);return}
      throw csUnsup('transform.'+n+' 대입')},
    call(n,a){
      if(n==='Translate'){const d=csVArg(a);snMoveTo(o,o.x+d.x,o.y+d.y);return null}
      throw csUnsup('transform.'+n+'()')}};
}
function goProxy(m,o){
  return{__h:'GameObject',__o:o,name:o.name,
    get(n){
      if(n==='name')return o.name;
      if(n==='transform')return trProxy(m,o);
      if(n==='activeSelf'||n==='activeInHierarchy')return o.active!==false;
      if(n==='tag')return'';
      throw csUnsup('gameObject.'+n)},
    set(n){throw csUnsup('gameObject.'+n+' 대입')},
    call(n,a){
      if(n==='SetActive'){if(a[0])delete o.active;else o.active=false;return null}
      if(n==='CompareTag')return''===csFmt(a[0]);
      throw csUnsup('gameObject.'+n+'()')}};
}
function camProxy(m,o){
  return{__h:'Camera',__o:o,name:o.name,
    get(n){
      if(n==='orthographicSize'||n==='size')return o.size;
      if(n==='gameObject')return goProxy(m,o);
      if(n==='transform')return trProxy(m,o);
      throw csUnsup('Camera.'+n)},
    set(n,v){
      if(n==='orthographicSize'||n==='size'){o.size=clamp(csN(v),2,4.5);return}
      throw csUnsup('Camera.'+n+' 대입')},
    call(n){throw csUnsup('Camera.'+n+'()')}};
}
function lightProxy(m,o){
  return{__h:'Light',__o:o,name:o.name,
    get(n){
      if(n==='gameObject')return goProxy(m,o);
      if(n==='transform')return trProxy(m,o);
      if(n==='enabled')return o.enabled!==false;
      if(n==='intensity')return o.intensity;
      if(n==='radius'||n==='range')return o.radius;
      if(n==='shadows'||n==='shadow')return !!o.shadows;
      throw csUnsup('Light.'+n)},
    set(n,v){
      if(n==='enabled'){o.enabled=!!v;return}
      if(n==='intensity'){o.intensity=snNum(clamp(csN(v),.1,1));return}
      if(n==='radius'||n==='range'){o.radius=snNum(clamp(csN(v),1,12));return}
      if(n==='shadows'||n==='shadow'){o.shadows=!!v;return}
      throw csUnsup('Light.'+n+' 대입')},
    call(n){throw csUnsup('Light.'+n+'()')}};
}
function heroProxy(m,o){
  return{__h:'Hero',__o:o,name:o.name,
    get(n){
      if(n==='hp')return o.hp;
      if(n==='maxHp')return 100;
      if(n==='position')return CsV(o.x,o.y);
      if(n==='gameObject')return goProxy(m,o);

      if(n==='hp'){o.hp=clamp(Math.round(csN(v)),0,100);return}
      throw csUnsup('Hero.'+n+' 대입')},
    call(n){throw csUnsup('Hero.'+n+'()')}};
}

  const kw='public|private|protected|internal|static|void|class|using|new|return|if|else|for|foreach|while|switch|case|break|continue|true|false|null|this|readonly|const|override|virtual|namespace|in|out|ref|var|struct|enum|interface|abstract|sealed|get|set';

  return new RegExp(String.raw`(\/\/[^\n]*|\/\*[\s\S]*?\*\/)|("(?:[^"\\\n]|\\.)*")|\b(${kw})\b|\b(${ty})\b|\b(\d+\.?\d*[fFdD]?)\b|\b([A-Za-z_]\w*)(?=\s*\()`,'g');

function csHighlight(code){
  let out='',last=0,m;CS_RE.lastIndex=0;
  const e=x=>x.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  while((m=CS_RE.exec(code))){
    if(m[0]==='')break;
    out+=e(code.slice(last,m.index));
    const c=m[1]?'cm':m[2]?'st':m[3]?'kw':m[4]?'ty':m[5]?'nu':'fn';
    out+=`<span class="t-${c}">${e(m[0])}</span>`;last=m.index+m[0].length;

}

/* 숫자 라벨(X · Y · HP …)을 좌우로 끌어 값 조절 (index와 같은 동작) */
$('#insp').addEventListener('pointerdown',e=>{
  const lab=e.target.closest('.num>i');if(!lab||e.button!==0)return;
  const inp=lab.parentElement.querySelector('input');if(!inp||inp.readOnly||inp.disabled)return;
  e.preventDefault();lab.setPointerCapture(e.pointerId);
  const sx=e.clientX,v0=parseFloat(inp.value)||0,step=parseFloat(inp.step)||1,mn=inp.min!==''?+inp.min:-Infinity,mx=inp.max!==''?+inp.max:Infinity,dec=step<1?2:0;
  let moved=false;document.body.classList.add('scrub');
  const mv=ev=>{const d=ev.clientX-sx;if(!moved&&Math.abs(d)<2)return;moved=true;
    const k=ev.shiftKey?10:ev.altKey?.1:1;let v=+(v0+Math.round(d/4)*step*k).toFixed(dec);v=clamp(v,mn,mx);
    if(String(v)!==inp.value){inp.value=v;inp.dispatchEvent(new Event('input',{bubbles:true}))}};
  const up=()=>{lab.removeEventListener('pointermove',mv);lab.removeEventListener('pointerup',up);lab.removeEventListener('pointercancel',up);document.body.classList.remove('scrub')};
  lab.addEventListener('pointermove',mv);lab.addEventListener('pointerup',up);lab.addEventListener('pointercancel',up);
});

function overridesFrom(p,res){
  const v=st.vals[p.id]||{},o={};
  res.members.filter(m=>m.kind==='field').forEach(m=>{if(m.name in v){const x=v[m.name];o[m.name]=m.fk==='num'?+x:m.fk==='bool'?!!x:x}});
  return o;
}
function run(){
  const p=P(),code=ta.value,res=parseCS(code);
  const g=gradeProblem(p,code);
  let vis;
  if(p.scene){snRestore();SN_EDIT=snClone(SN_OBJS);vis=runOnce(code,overridesFrom(p,res),SN_OBJS)}
  else vis=runOnce(code,overridesFrom(p,res));
  setConsole(vis.out,true);flash(!vis.fatal);
  if(p.scene){
    renderHier();renderInsp();snRedraw();
    const vb=$('.vtab[data-v="'+p.view+'"]');if(vb&&!vb.classList.contains('on'))vb.click();
  }
  if(g.pass){
    st.done[p.id]=true;save();renderTop();
    const last=st.cur===PROBLEMS.length-1,all=PROBLEMS.every(q=>st.done[q.id]),nextL=LESSONS[LESSONS.indexOf(LESSON)+1];
    const btn=!last?'<button class="btn pri nx" type="button" id="nx">다음 문제</button>':(all&&nextL?`<button class="btn pri nx" type="button" id="nxL">레슨 ${nextL.no} 시작</button>`:'');
    setVerdict('ok',(all&&last?LESSON.clear:'통과했어요.')+btn);
    const nx=$('#nx');if(nx)nx.onclick=()=>show(st.cur+1);
    const nl=$('#nxL');if(nl)nl.onclick=()=>{location.hash=nextL.hash};
  }else setVerdict('bad',esc(g.msg));
}

function acCompute(v,pos,force){

  if(ac.guide){b.innerHTML=`<div class="acg">${acGuide(ac.items[0])}</div><div class="acf">. 입력 시 멤버 목록 · Ctrl+Space 후보 보기 · Esc 닫기</div>`;acPlace();return}
  const right=it=>it.k==='fn'?(it.gen?'<T>() → T':'('+(it.sig||'')+') → '+(it.t||'void')):(it.k==='pr'||it.k==='var')?(it.t||''):(it.d||'');
  b.innerHTML=`<div class="acl">`+ac.items.map((it,i)=>`<div class="aci${i===ac.sel?' on':''}" data-i="${i}" role="option"><span class="ack ${it.k}">${AC_ICON[it.k]}</span><span class="acn">${esc(it.n)}</span><span class="acd">${esc(right(it))}</span></div>`).join('')+`</div><div class="acg">${acGuide(ac.items[ac.sel])}</div><div class="acf">↑↓ 선택 · Enter/Tab 삽입 · Esc 닫기</div>`;
  acPlace();
  const on=b.querySelector('.aci.on');if(on)on.scrollIntoView({block:'nearest'});
}
function acUpdate(force){
  if(ta.selectionStart!==ta.selectionEnd){acHide();return}
  let r=null;try{r=acCompute(ta.value,ta.selectionStart,force)}catch(err){r=null}
  if(!r){acHide();return}
  const same=ac.on&&ac.start===r.start;
  ac.on=true;ac.items=r.items;ac.start=r.start;ac.guide=!!r.guide;if(!same||ac.guide)ac.sel=0;ac.sel=Math.min(ac.sel,r.items.length-1);
  acRender();
}
function acAccept(i){
  const it=ac.items[i];if(!it)return;
  const v=ta.value,a=ac.start,b=ta.selectionStart;
  const ls=v.lastIndexOf('\n',a-1)+1,ind=/^[ \t]*/.exec(v.slice(ls,a))[0];
  let txt=it.n,cur=a+txt.length,retrig=false;
  if(it.sn){const s=it.sn.replace(/\n/g,'\n'+ind),ci=s.indexOf('|');txt=s.replace('|','');cur=ci>=0?a+ci:a+txt.length}
  else if(it.k==='fn'&&v[b]!=='('){
    if(it.gen){txt=it.n+'<>()';cur=a+it.n.length+1;retrig=true}
    else{txt=it.n+'()';cur=a+it.n.length+(it.a?1:2)}
  }
  ta.setRangeText(txt,a,b,'end');ta.setSelectionRange(cur,cur);
  ac.mute=true;ta.dispatchEvent(new Event('input'));ac.mute=false;
  acHide();ta.focus();
  if(retrig)setTimeout(()=>acUpdate(true),0);
}
/* 편집기보다 먼저 키를 받아야 하므로, 편집기 자체 키 처리(Enter 자동 들여쓰기·Tab)보다 앞에 등록합니다 */
ta.addEventListener('keydown',e=>{
  if(e.ctrlKey&&!e.altKey&&!e.metaKey&&e.code==='Space'){e.preventDefault();e.stopImmediatePropagation();acUpdate(true);return}
  if(!ac.on)return;
  if(ac.guide){
    if(e.key==='Escape'){e.preventDefault();e.stopImmediatePropagation();acHide();return}
    if(!['Shift','Control','Alt','Meta','CapsLock'].includes(e.key)&&!(e.key.length===1&&!e.ctrlKey&&!e.metaKey&&!e.altKey)&&e.key!=='Backspace')acHide();
    return;
  }
  const n=ac.items.length,mv=d=>{e.preventDefault();e.stopImmediatePropagation();ac.sel=(ac.sel+d+n)%n;acRender()};
  if(e.key==='ArrowDown')mv(1);
  else if(e.key==='ArrowUp')mv(-1);
  else if(e.key==='PageDown'){e.preventDefault();e.stopImmediatePropagation();ac.sel=Math.min(n-1,ac.sel+8);acRender()}
  else if(e.key==='PageUp'){e.preventDefault();e.stopImmediatePropagation();ac.sel=Math.max(0,ac.sel-8);acRender()}
  else if((e.key==='Enter'||e.key==='Tab')&&!e.ctrlKey&&!e.metaKey&&!e.shiftKey&&!e.altKey&&!e.isComposing){e.preventDefault();e.stopImmediatePropagation();acAccept(ac.sel)}
  else if(e.key==='Escape'){e.preventDefault();e.stopImmediatePropagation();acHide()}
  else if(['ArrowLeft','ArrowRight','Home','End'].includes(e.key))acHide();
});
ta.addEventListener('input',e=>{
  if(ac.mute)return;
  if(e.inputType==='insertText'||(ac.on&&e.inputType==='deleteContentBackward'))acUpdate(false);
  else if(ac.on)acHide();
});
ta.addEventListener('blur',()=>setTimeout(acHide,120));
ta.addEventListener('click',acHide);
ta.addEventListener('scroll',()=>{if(ac.on)acPlace()});
window.addEventListener('resize',acHide);

let inspT=0;
ta.addEventListener('input',()=>{
  st.code[P().id]=ta.value;save();paintEd();edPos();
  clearTimeout(inspT);inspT=setTimeout(()=>{if(SN.sel==='quiz')renderInsp()},250);
});
ta.addEventListener('scroll',syncEd);
['keyup','click','focus'].forEach(ev=>ta.addEventListener(ev,edPos));
ta.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)){e.preventDefault();run();return}
  const a=ta.selectionStart,b=ta.selectionEnd,v=ta.value;
  if(e.key==='Tab'&&!e.ctrlKey&&!e.altKey){
    e.preventDefault();
    if(e.shiftKey){const ls=v.lastIndexOf('\n',a-1)+1,m=/^( {1,4}|\t)/.exec(v.slice(ls));if(m)ta.setRangeText('',ls,ls+m[0].length,'end')}
    else ta.setRangeText('    ',a,b,'end');
    ta.dispatchEvent(new Event('input'));
  }else if(e.key==='Enter'&&!e.isComposing){
    e.preventDefault();
    const ls=v.lastIndexOf('\n',a-1)+1,ind=/^[ \t]*/.exec(v.slice(ls,a))[0],more=v.slice(ls,a).trimEnd().endsWith('{')?'    ':'';
    ta.setRangeText('\n'+ind+more,a,b,'end');ta.dispatchEvent(new Event('input'));
  }else if(e.key==='}'&&a===b&&/^[ \t]+$/.test(v.slice(v.lastIndexOf('\n',a-1)+1,a))){
    e.preventDefault();const ls=v.lastIndexOf('\n',a-1)+1,ind=v.slice(ls,a).replace(/( {1,4}|\t)$/,'');ta.setRangeText(ind+'}',ls,a,'end');ta.dispatchEvent(new Event('input'));
  }
});

renderHier();
show(st.cur);

/* ===================== 메인 화면 · 화면 전환 ===================== */
function renderHome(){
  $('#cards').innerHTML=LESSONS.map(L=>{
    const n=L.problems.filter(p=>st.done[p.id]).length,t=L.problems.length,done=n===t;
    const label=done?'다시 보기':n?'이어하기':'시작하기',state=done?'완료':n?'진행 중':'시작 전';
    return`<button type="button" class="card" data-go="${L.hash}" aria-label="레슨 ${L.no} ${esc(L.title)} · ${state}">
      <div class="ctop"><span class="chip">레슨 ${L.no}</span><span class="state${done?' done':''}">${done?'✓ ':''}${state}</span></div>
      <h2>${esc(L.title)}</h2><p>${esc(L.lead)}</p><pre>${csHighlight(L.preview)}</pre>
      <div class="cfoot"><div class="cbar"><i style="width:${n/t*100}%"></i></div><span class="cnum">${n} / ${t} 문제</span><span class="go">${label}</span></div></button>`;
  }).join('')+`<div class="card soon" aria-hidden="true"><p>다음 레슨을 준비하고 있어요</p></div>`;
}
$('#cards').addEventListener('click',e=>{const c=e.target.closest('[data-go]');if(c)location.hash=c.dataset.go});
$('#toHome').onclick=()=>{location.hash=''};
(function(){
  const K='thaniya.learn.topclosed',tg=$('#topTg'),bx=$('#topx');
  const set=c=>{bx.classList.toggle('closed',c);tg.setAttribute('aria-expanded',String(!c));try{localStorage.setItem(K,c?'1':'0')}catch(e){}};
  let c=false;try{c=localStorage.getItem(K)==='1'}catch(e){}
  bx.classList.toggle('closed',c);tg.setAttribute('aria-expanded',String(!c));
  tg.onclick=()=>set(!bx.classList.contains('closed'));
})();
function route(){
  const L=LESSONS.find(x=>'#'+x.hash===location.hash);
  $('#home').hidden=!!L;$('#lessonView').hidden=!L;
  if(L){useLesson(L);document.title='Thaniya 학습 · '+L.title;show(st.cur);snRedraw()}
  else{snRestore();document.title='Thaniya 학습';renderHome()}
  window.scrollTo(0,0);
}
addEventListener('hashchange',route);
route();

</script>
